name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skips entirely if only docs/markdown files changed.
  gate:
    name: gate (skip-if-docs-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Verify CI gate regression contracts
        run: python3 -m unittest discover -s tests -p test_ci_gate.py -v
      - id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**/*.md'

  lint:
    name: lint
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: detect-stack
        id: stack
        run: |
          if [ -f package.json ]; then echo "stack=npm" >> "$GITHUB_OUTPUT"
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then echo "stack=pip" >> "$GITHUB_OUTPUT"
          else echo "stack=none" >> "$GITHUB_OUTPUT"; fi
      - name: run-npm-lint
        if: steps.stack.outputs.stack == 'npm'
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          elif [ -f pnpm-lock.yaml ]; then npm i -g pnpm && pnpm i --frozen-lockfile
          else npm i --no-audit --no-fund
          fi
          npm run lint --if-present
      - name: run-py-lint
        if: steps.stack.outputs.stack == 'pip'
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy 2>/dev/null || true
          ruff check . 2>/dev/null || true
          mypy . 2>/dev/null || true

  test:
    name: test
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: detect-stack
        id: stack
        run: |
          if [ -f package.json ]; then echo "stack=npm" >> "$GITHUB_OUTPUT"
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then echo "stack=pip" >> "$GITHUB_OUTPUT"
          else echo "stack=none" >> "$GITHUB_OUTPUT"; fi
      - name: run-npm-test
        if: steps.stack.outputs.stack == 'npm'
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          elif [ -f pnpm-lock.yaml ]; then npm i -g pnpm && pnpm i --frozen-lockfile
          else npm i --no-audit --no-fund
          fi
          npm test --if-present
      - name: run-py-test
        if: steps.stack.outputs.stack == 'pip'
        run: |
          python -m pip install --upgrade pip
          pip install -e . 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true
          pytest -q 2>/dev/null || python -m unittest discover 2>/dev/null || echo "no test runner"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
